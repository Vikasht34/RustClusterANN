[package]
name = "rustsptag"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustsptag"
path = "src/lib.rs"

[[bin]]
name = "bench_sift_storage"
path = "src/bin/bench_sift_storage.rs"

[[bin]]
name = "bench_cohere1m"
path = "src/bin/bench_cohere1m.rs"

[[bin]]
name = "bench_sift_quant"
path = "src/bin/bench_sift_quant.rs"

[[bin]]
name = "bench_sift_1bit"
path = "src/bin/bench_sift_1bit.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libc = "0.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = ["simd"]
simd = []
