[package]
name = "rustsptag"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustsptag"
path = "src/lib.rs"

# Disable auto-discovery of binaries
autobins = false

# Only enable working binaries needed for benchmarks
[[bin]]
name = "bench_cohere_ondemand"
path = "src/bin/bench_cohere_ondemand.rs"

[[bin]]
name = "bench_sift_ondemand"
path = "src/bin/bench_sift_ondemand.rs"

[[bin]]
name = "bench_cohere_1bit"
path = "src/bin/bench_cohere_1bit.rs"

[[bin]]
name = "bench_sift_1bit"
path = "src/bin/bench_sift_1bit.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libc = "0.2"
crossbeam = "0.8"
clap = { version = "4", features = ["derive"] }
rayon = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.4", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = ["simd"]
simd = []
